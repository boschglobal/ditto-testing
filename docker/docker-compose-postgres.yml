# PostgreSQL persistence override for the system-test environment. Layer AFTER docker-compose.yml
# (and docker-compose.override.yml when present):
#
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose-postgres.yml up -d
#
# or simply use ./start-postgres.sh / ./stop-postgres.sh (see README-postgres.md).
#
# policies/things/connectivity persist journals + snapshots to PostgreSQL via two extension JARs
# mounted into /opt/ditto/extensions/ (picked up by the image's
# CLASSPATH=/opt/ditto/*:/opt/ditto/extensions/*): the shaded base
# ditto-postgres-client-extension (postgres-client infra + all third-party deps) plus the thin
# ditto-postgres-persistence-extension (persistence-r2dbc classes). All extension JARs are 0-SNAPSHOT
# and MUST come from the same build (a boot self-check fails fast on mismatch or on a thin JAR without
# its base).
#
# things-search's backend is SELECTABLE, not fixed: by default (SEARCH_BACKEND=postgres) it runs on
# PostgreSQL via the docker-compose-postgres-search.yml overlay (layered after this file); with
# SEARCH_BACKEND=mongodb it keeps indexing in MongoDB and only this file is used. Either way MongoDB
# stays defined (see the mongodb note below). DITTO_REPO_DIR must point at a ditto worktree containing
# the Postgres persistence + search feature (the search-branch worktree; default: ./../../ditto).

version: "2.4"

services:

  postgres:
    image: docker.io/postgres:16
    networks:
      - test
    expose:
      - "5432"
    ports:
      # published for host-side psql debugging
      - ${POSTGRES_PORT_TCP:-5432}:5432
    environment:
      - POSTGRES_DB=ditto
      - POSTGRES_USER=ditto
      - POSTGRES_PASSWORD=ditto
    # Deliberately NO named volume: CleanupIT is documented to require a fresh environment and a
    # persistent volume would accumulate state across runs. Fresh container = fresh database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditto -d ditto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # mongodb stays exactly as defined in docker-compose.yml. It is REQUIRED when SEARCH_BACKEND=mongodb
  # (things-search indexes there) and harmless when SEARCH_BACKEND=postgres (nothing uses it, but the
  # container is cheap and keeps this file backend-agnostic). The shared docker-compose.env
  # (MONGO_DB_HOSTNAME etc.) is intentionally still injected into the three Postgres-backed services
  # below: harmless there (their Mongo config resolves but the Postgres provider ignores it) — do NOT
  # "clean it up".

  policies:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Explicit JAR file names (compose cannot glob); the module version is fixed at 0-SNAPSHOT
      # (the ditto repo's `revision` property) independent of the image tag. Mount the shaded base
      # (client infra + third-party deps) AND the thin persistence JAR — both from the same build.
      - ${DITTO_REPO_DIR:-./../../ditto}/internal/utils/postgres-client-extension/target/ditto-postgres-client-extension-0-SNAPSHOT.jar:/opt/ditto/extensions/ditto-postgres-client-extension-0-SNAPSHOT.jar:ro
      - ${DITTO_REPO_DIR:-./../../ditto}/internal/utils/postgres-persistence-extension/target/ditto-postgres-persistence-extension-0-SNAPSHOT.jar:/opt/ditto/extensions/ditto-postgres-persistence-extension-0-SNAPSHOT.jar:ro
      - ./postgres/policies-postgres.conf:/opt/ditto/policies-postgres.conf:ro
    environment:
      - HOSTING_ENVIRONMENT=filebased
      - HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/policies-postgres.conf
      - POSTGRES_URI=r2dbc:postgresql://postgres:5432/ditto
      - POSTGRES_USER=ditto
      - POSTGRES_PASSWORD=ditto
      - POSTGRES_DDL_USER=ditto
      - POSTGRES_DDL_PASSWORD=ditto
      - POSTGRES_SSL_MODE=disable

  things:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DITTO_REPO_DIR:-./../../ditto}/internal/utils/postgres-client-extension/target/ditto-postgres-client-extension-0-SNAPSHOT.jar:/opt/ditto/extensions/ditto-postgres-client-extension-0-SNAPSHOT.jar:ro
      - ${DITTO_REPO_DIR:-./../../ditto}/internal/utils/postgres-persistence-extension/target/ditto-postgres-persistence-extension-0-SNAPSHOT.jar:/opt/ditto/extensions/ditto-postgres-persistence-extension-0-SNAPSHOT.jar:ro
      - ./postgres/things-postgres.conf:/opt/ditto/things-postgres.conf:ro
    environment:
      - HOSTING_ENVIRONMENT=filebased
      - HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/things-postgres.conf
      - POSTGRES_URI=r2dbc:postgresql://postgres:5432/ditto
      - POSTGRES_USER=ditto
      - POSTGRES_PASSWORD=ditto
      - POSTGRES_DDL_USER=ditto
      - POSTGRES_DDL_PASSWORD=ditto
      - POSTGRES_SSL_MODE=disable

  connectivity:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DITTO_REPO_DIR:-./../../ditto}/internal/utils/postgres-client-extension/target/ditto-postgres-client-extension-0-SNAPSHOT.jar:/opt/ditto/extensions/ditto-postgres-client-extension-0-SNAPSHOT.jar:ro
      - ${DITTO_REPO_DIR:-./../../ditto}/internal/utils/postgres-persistence-extension/target/ditto-postgres-persistence-extension-0-SNAPSHOT.jar:/opt/ditto/extensions/ditto-postgres-persistence-extension-0-SNAPSHOT.jar:ro
      - ./postgres/connectivity-postgres.conf:/opt/ditto/connectivity-postgres.conf:ro
    environment:
      - HOSTING_ENVIRONMENT=filebased
      - HOSTING_ENVIRONMENT_FILE_LOCATION=/opt/ditto/connectivity-postgres.conf
      - POSTGRES_URI=r2dbc:postgresql://postgres:5432/ditto
      - POSTGRES_USER=ditto
      - POSTGRES_PASSWORD=ditto
      - POSTGRES_DDL_USER=ditto
      - POSTGRES_DDL_PASSWORD=ditto
      - POSTGRES_SSL_MODE=disable
