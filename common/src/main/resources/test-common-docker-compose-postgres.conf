include "test-common-docker-compose"      # gateway host, brokers, oauth, mongo (search) unchanged

# NOTE: only CommonTestConfig loads this file (it builds the filename from the raw
# -Dtest.environment string). The newer config.TestConfig loader derives the filename from the
# TestEnvironment enum and resolves "docker-compose-postgres" to test-common-docker-compose.conf —
# keys added here are invisible to TestConfig consumers; keep this file to persistence.backend
# and postgres.* (read via CommonTestConfig) only.

persistence.backend = "postgres"

postgres {
  jdbc-uri = "jdbc:postgresql://postgres:5432/ditto"   # in-network hostname (NOT localhost)
  jdbc-uri = ${?POSTGRES_JDBC_URI}                     # override hook for ad-hoc setups
  user = "ditto"
  password = "ditto"
}
