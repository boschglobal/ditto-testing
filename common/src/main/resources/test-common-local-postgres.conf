# NOTE (carry over from test-common-docker-compose-postgres.conf): config.TestConfig resolves its
# filename from the TestEnvironment *enum* (local-postgres -> LOCAL -> test-common-local.conf), so
# the persistence.backend / postgres.* keys below are visible only to CommonTestConfig consumers
# (which use the raw -Dtest.environment string), NOT to TestConfig consumers. CleanupIT reads them
# via CommonTestConfig -> PersistenceInspectorFactory, so this is fine — but a future key added
# here will NOT reach TestConfig.
include "test-common-local"        # gateway/oauth on localhost, unchanged
persistence.backend = "postgres"
postgres {
  jdbc-uri = "jdbc:postgresql://localhost:5432/ditto"
  jdbc-uri = ${?POSTGRES_JDBC_URI}
  user = "ditto"
  password = "ditto"
}
# C1: the reused "Gateway for test" run config keeps the Mongo-era DEVOPS_SECURED=true /
# DEVOPS_PASSWORD=foobar, but test-common-local sets gateway.devops.auth.enabled=false. Without the
# re-enable below, PiggyBackCommander sends CleanupIT's /devops/piggyback requests unauthenticated
# and the secured gateway returns 401. (Docker mode instead disables both ends.)
gateway.devops.auth.enabled = true
gateway.devops.auth.password = "foobar"

# C2: an SSH tunnel's direct-tcpip forward destination is resolved by sshd INSIDE the docker-ssh-1
# container, not on the host running the test JVM/Ditto. test-common-local's
# connectivity.http.tunnel = ${default.hostname} = "localhost" therefore points the forward at the
# ssh container's own loopback (nothing listening) instead of the host's HttpTestServer port.
# host.docker.internal resolves inside docker-ssh-1 to the host and is reachable (verified). The
# broker tunnel destinations (mqtt/amqp/rabbitmq/kafka) use docker.gateway.host + published ports and
# are unaffected; connectivity.amqp10.hono.tunnel still inherits ${default.hostname} = "localhost"
# (host-only whitebox port 5887) and would need the same treatment if tunneled Hono tests are added.
# For HOST-RUN on macOS this name must ALSO resolve on the host: Ditto connectivity's own host
# validator resolves it before any tunnel exists, and macOS doesn't expose container-only DNS names
# by default. One-time setup: add "127.0.0.1 host.docker.internal" to /etc/hosts (sudo) — the
# validator then resolves it locally while sshd in the container still resolves it to the host
# (verified: a resolvable stand-in value made the tunneled test pass end-to-end).
connectivity.http.tunnel = "host.docker.internal"
